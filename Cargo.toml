[package]
name = "ixa-basic-transmission"
version = "0.1.0"
edition = "2021"

[lib]
# `rlib` lets `benches/` link against the crate; the wasm shim is still
# built from the `cdylib` artifact and is unaffected.
crate-type = ["cdylib", "rlib"]

[dependencies]
ixa = "3.0.0"
wasm-bindgen = "0.2"
cfasim-model = "0.4"
enum_dispatch = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = { version = "0.10.2", default-features = false, features = ["std", "std_rng"] }
rand_distr = "0.6"
# CLI-only deps for the `model` bin. Optional + behind the default `cli`
# feature so the wasm cargo tasks (`--no-default-features`) never build them.
clap = { version = "4", features = ["derive"], optional = true }
toml = { version = "0.8", optional = true }

[features]
# On by default so `cargo run -- <file>` just works; the wasm tasks
# (plz check/build/lint) pass `--no-default-features` to drop the bin.
default = ["cli"]
cli = ["dep:clap", "dep:toml"]

[dev-dependencies]
criterion = "0.5"

# Host-side CLI driver for `model::run` from a params file: `cargo run -- <file>`.
# `required-features` keeps it (and clap/toml) out of the `--no-default-features`
# wasm build. See src/bin.rs.
[[bin]]
name = "model"
path = "src/bin.rs"
required-features = ["cli"]

[[bench]]
name = "run"
harness = false
