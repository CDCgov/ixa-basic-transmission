[workspace]
members = [".", "simulator/model"]
resolver = "2"

[package]
name = "ixa-basic-transmission"
version = "0.1.0"
edition = "2024"

[features]
default = ["cli"]
cli = ["env_logger", "log4rs", "ixa/default"]

[dependencies]
anyhow = "1.0.100"
ixa = { version = "=2.0.0-beta2", default-features = false, features = ["logging"] }
log = "0.4"
env_logger = { version = "0.11", optional = true }
log4rs = { version = "1.4.0", features = ["console_appender", "file_appender"], optional = true }
paste = "1.0.15"
rand = "0.9.3"
rand_distr = "0.5.1"
seq-macro = "0.3.6"
serde = "1.0.228"
statrs = { rev = "5da34705b80781b907b2d14905e05f45b0b7a8ae", git = "https://github.com/statrs-dev/statrs.git" }
toml = "1.1.0"
serde_json = "1.0.149"

[dev-dependencies]
approx = "0.5.1"
anyhow = "1.0.100"
