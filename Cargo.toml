[package]
name = "ixa-basic-transmission"
version = "0.1.0"
edition = "2021"

[lib]
# `rlib` lets `benches/` link against the crate; the wasm shim is still
# built from the `cdylib` artifact and is unaffected.
crate-type = ["cdylib", "rlib"]

[dependencies]
ixa = "2.0.0"
wasm-bindgen = "0.2"
cfasim-model = "0.4"
enum_dispatch = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = { version = "0.9", default-features = false, features = ["std", "std_rng"] }
rand_distr = "0.5"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "run"
harness = false
