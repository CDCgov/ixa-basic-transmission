<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ixa Basic Transmission</title>
    <script type="text/javascript">
      // SPA fallback for GitHub Pages. GH Pages serves this 404.html for any
      // path with no matching file (e.g. /ixa-basic-transmission/explore on a
      // hard reload or deep link). We encode the path+query into a single
      // query string and redirect to the app root; index.html decodes it back
      // and hands a proper URL to vue-router. MIT, rafgraph/spa-github-pages.
      //
      // pathSegmentsToKeep = number of leading path segments that are the site
      // base, not app routes. This is a project page under /ixa-basic-
      // transmission/, so keep 1.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
