name = "Large households + community"
description = "Illustrative larger-household distribution (mean ≈ 5.3) plus a uniform community pool. Sizes are hand-picked for illustration, not from a specific source."

[[settings]]
name = "household"
alpha = 1.0
proportion = 0.6
sizes = [
    [1, 0.04],
    [2, 0.08],
    [3, 0.11],
    [4, 0.11],
    [5, 0.14],
    [6, 0.12],
    [7, 0.11],
    [8, 0.09],
    [9, 0.08],
    [10, 0.06],
    [11, 0.04],
    [12, 0.02],
]

# Community = uniform random-mixing pool. See households_us.toml for
# the alpha=0 rationale.
[[settings]]
name = "community"
alpha = 0.0
proportion = 0.4
sizes = [[100000, 1.0]]
