name: Setup Rust
description: Install wasm32 target and wasm-pack (cached)

runs:
  using: composite
  steps:
    - shell: bash
      run: rustup target add wasm32-unknown-unknown
    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/bin/wasm-pack
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target/wasm32-unknown-unknown
        key: rust-${{ runner.os }}-wasm32-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
        restore-keys: |
          rust-${{ runner.os }}-wasm32-
          rust-${{ runner.os }}-
    - shell: bash
      run: command -v wasm-pack || cargo install wasm-pack
