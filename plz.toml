# Run tasks with: plz [taskname]
# Docs: https://plzplz.org/reference.html
# Show the schema for this file: plz plz schema

# Faster way to check for errors
[tasks.check]
run = "cargo check --target wasm32-unknown-unknown"

# Build, development mode
[tasks.build]
run = "cargo build --target wasm32-unknown-unknown"

# Run tests
[tasks.test]
run = "cargo test"
git_hook = "pre-push"

# Check linting and formatting
[tasks.lint]
run_serial = ["cargo clippy --target wasm32-unknown-unknown", "cargo fmt --check"]
fail_hook = { suggest_command = "plz fix" }
git_hook = "pre-commit"

# Fix lint and formatting issues
[tasks.fix]
run_serial = ["cargo fmt", "cargo clippy --fix --allow-dirty --target wasm32-unknown-unknown"]

# UI tasks run inside simulator/ with pnpm-resolved bins
[taskgroup.ui.extends]
env = "pnpm"
dir = "simulator"

# Install frontend dependencies
[taskgroup.ui.setup]
run = "pnpm install"

# Start development server (builds wasm, watches frontend)
[taskgroup.ui.dev]
depends = ["ui.setup"]
run = "vite"

# Build for production
[taskgroup.ui.build]
depends = ["ui.setup"]
run = "vite build"
git_hook = "pre-push"

# Preview production build
[taskgroup.ui.preview]
depends = ["ui.setup"]
run = "vite preview"
