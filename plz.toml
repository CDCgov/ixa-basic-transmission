# Run tasks with: plz [taskname]
# Docs: https://plzplz.org/reference.html
# Show the schema for this file: plz plz schema

# Faster way to check for errors. `--no-default-features` drops the `cli`
# feature so the host-only `model` bin (clap/toml) stays out of the wasm build.
[tasks.check]
run = "cargo check --target wasm32-unknown-unknown --no-default-features"

# Build, development mode
[tasks.build]
run = "cargo build --target wasm32-unknown-unknown --no-default-features"

# Run tests
[tasks.test]
run = "cargo test"
git_hook = "pre-push"

# Run benchmarks (host target). Compares model::run cost across
# InfectionRate variants — see benches/run.rs.
[tasks.bench]
run = "cargo bench"

# Run the model on the host from a params file (config-preset shape).
# Pass the file path + flags after `--`, e.g.
#   plz run -- config/parameters/baseline.toml --sims 20
# (Equivalent to `cargo run -- config/parameters/baseline.toml --sims 20`.)
[tasks.run]
run = "cargo run --bin model"

# Check linting and formatting. Wasm clippy drops `cli` (see check); fmt still
# covers the bin (it formats every target regardless of features).
[tasks.lint]
run_serial = [
  "cargo clippy --target wasm32-unknown-unknown --no-default-features",
  "cargo fmt --check",
]
fail_hook = { suggest_command = "plz fix" }
git_hook = "pre-commit"

# Fix lint and formatting issues
[tasks.fix]
run_serial = [
  "cargo fmt",
  "cargo clippy --fix --allow-dirty --target wasm32-unknown-unknown --no-default-features",
]

# UI tasks run inside simulator/ with pnpm-resolved bins
[taskgroup.ui.extends]
env = "pnpm"
dir = "simulator"

# Install frontend dependencies
[taskgroup.ui.setup]
run = "pnpm install"

# Start development server (builds wasm, watches frontend)
[taskgroup.ui.dev]
depends = ["ui.setup"]
run = "vite"

# Build for production
[taskgroup.ui.build]
depends = ["ui.setup"]
run = "vite build"
git_hook = "pre-push"

# Preview production build
[taskgroup.ui.preview]
depends = ["ui.setup"]
run = "vite preview"

# JS unit tests (vitest). Covers pure helpers in `simulator/src/composables/`.
[taskgroup.ui.unit]
depends = ["ui.setup"]
run = "vitest run"
git_hook = "pre-push"

# End-to-end browser tests (Playwright). Spins up its own vite dev server.
[taskgroup.ui.e2e]
depends = ["ui.setup"]
run = "playwright test"
git_hook = "pre-commit"
